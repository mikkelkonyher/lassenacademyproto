# Runs lint, build, and Bruno E2E tests on push to main
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: Bruno E2E Tests
    runs-on: ubuntu-latest
    needs: lint-and-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Bruno CLI
        run: npm install -g @usebruno/cli

      - name: Run E2E tests
        working-directory: ./bruno
        run: |
          bru run e2e-flow \
            --env ci \
            --env-var supabase_url=${{ secrets.SUPABASE_URL }} \
            --env-var supabase_anon_key=${{ secrets.SUPABASE_ANON_KEY }} \
            --env-var test_email=${{ secrets.TEST_EMAIL }} \
            --env-var test_password=${{ secrets.TEST_PASSWORD }}
